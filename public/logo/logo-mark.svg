<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -30 960 919.4" width="96" height="91.9" role="img" aria-label="Eyes Wise Open">
  <title>Eyes Wise Open</title>
  <style>
    .ewo-lid { transform: translateY(-640px); }
    .ewo-shut { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .ewo-look { animation: ewo-look 7s ease-in-out infinite; }
      .ewo-lid { animation: ewo-blink 7s ease-in-out infinite; }
      .ewo-shut { animation: ewo-shut 7s ease-in-out infinite; }
    }
    @keyframes ewo-look {
      0%, 12% { transform: translateX(0); }
      18%, 30% { transform: translateX(90px); }
      36%, 48% { transform: translateX(-90px); }
      54%, 100% { transform: translateX(0); }
    }
    @keyframes ewo-blink {
      0%, 66% { transform: translateY(-640px); }
      69%, 71% { transform: translateY(0); }
      75%, 100% { transform: translateY(-640px); }
    }
    @keyframes ewo-shut {
      0%, 67% { opacity: 0; }
      69%, 71% { opacity: 1; }
      73%, 100% { opacity: 0; }
    }
  </style>
